<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070910" />
  <title>Inky Fox — бриф на разработку</title>
  <link rel="stylesheet" href="styles.css?v=8" />
</head>
<body>
  <div class="bg-glow glow-a"></div>
  <div class="bg-glow glow-b"></div>
  <div class="bg-glow glow-c"></div>

  <main class="app-shell">
    <header class="topbar">
      <a href="#" id="brandLink" class="brand">
        <span class="brand-mark">✦</span>
        <span class="brand-copy"><strong>INKY FOX</strong><small>бриф на разработку</small></span>
      </a>
      <div class="save-status" id="saveStatus" aria-live="polite"></div>
    </header>

    <section class="progress-shell is-hidden" id="progressShell">
      <div class="progress-meta"><span id="progressLabel"></span><span id="progressPercent"></span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </section>

    <section class="quiz-card"><div id="screen"></div></section>

    <div class="nav-row is-hidden" id="navRow">
      <button type="button" class="btn btn-ghost" id="backBtn">Назад</button>
      <button type="button" class="btn btn-primary" id="nextBtn">Далее</button>
    </div>

    <div class="device-note is-hidden" id="deviceNote">Ответы сохраняются на этом устройстве — можно вернуться позже.</div>
  </main>
  <script src="app.js?v=8"></script>
</body>
</html>
