<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#06111f" />
  <meta name="description" content="Бриф Inky Fox на разработку MiniApp и веб-страниц" />
  <title>Inky Fox — бриф на разработку</title>
  <link rel="stylesheet" href="styles.css?v=10" />
</head>
<body>
  <main class="shell">
    <section class="app" id="app">
      <div class="watercolor watercolor-left" aria-hidden="true"></div>
      <div class="watercolor watercolor-right" aria-hidden="true"></div>
      <div class="stars" aria-hidden="true"></div>

      <header class="brandbar" id="brandbar">
        <button class="brand" id="brandBtn" type="button" aria-label="В начало">
          <span class="brand-script">Inky Fox</span>
          <span class="brand-paw">🐾</span>
          <span class="brand-sub">ИДЕИ. СМЫСЛ. РЕАЛИЗАЦИЯ</span>
        </button>
        <div class="save-status" id="saveStatus"></div>
      </header>

      <div class="progress is-hidden" id="progress">
        <button class="back-circle" id="topBack" type="button" aria-label="Назад">←</button>
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-count" id="progressCount">1 / 11</div>
      </div>

      <div class="screen" id="screen"></div>

      <nav class="nav is-hidden" id="nav">
        <button class="btn btn-back" id="backBtn" type="button">← <span>Назад</span></button>
        <button class="btn btn-next" id="nextBtn" type="button"><span>Далее</span> →</button>
      </nav>

      <footer class="mini-footer" id="miniFooter">
        <span class="footer-script">Inky Fox</span>
        <span>ТЕХНОЛОГИИ ДЛЯ ТВОИХ ИДЕЙ</span>
      </footer>
    </section>
  </main>
  <script src="app.js?v=10"></script>
</body>
</html>
