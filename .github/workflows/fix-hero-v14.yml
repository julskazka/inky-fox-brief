name: Fix hero image v14

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Build reliable PNG hero and CSS
        shell: bash
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          from PIL import Image
          import base64

          raw = Path('assets/inky-fox.b64').read_text(encoding='utf-8').strip()
          img = Image.open(BytesIO(base64.b64decode(raw))).convert('RGBA')
          img.save('assets/hero.png', format='PNG', optimize=True)

          css = '''/* v14: render hero as a normal PNG so it cannot fail through base64 loading */
          .hero-stage{position:relative;}
          .hero-stage .hero-img{display:none!important;}
          .hero-stage::after{
            content:"";
            position:relative;
            z-index:2;
            display:block;
            width:min(100%,500px);
            aspect-ratio:5/6;
            align-self:flex-end;
            background:url("assets/hero.png?v=14") center bottom/contain no-repeat;
            filter:drop-shadow(0 20px 32px rgba(0,0,0,.4));
          }
          @media(max-width:760px){
            .hero-stage::after{width:min(92%,360px);aspect-ratio:5/6;align-self:center;}
          }
          '''
          Path('hero-fix.css').write_text(css, encoding='utf-8')

          html = Path('index.html').read_text(encoding='utf-8')
          if 'hero-fix.css' not in html:
              html = html.replace('</head>', '  <link rel="stylesheet" href="hero-fix.css?v=14" />\n</head>')
          else:
              import re
              html = re.sub(r'hero-fix\.css\?v=\d+', 'hero-fix.css?v=14', html)
          Path('index.html').write_text(html, encoding='utf-8')
          PY

      - name: Commit hero fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hero.png hero-fix.css index.html
          git commit -m "Fix first-screen fox image with PNG asset"
          git push
