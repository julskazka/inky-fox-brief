<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070910" />
  <meta name="description" content="Бриф на разработку MiniApp / веб-страницы — Inky Fox" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Inky Fox — бриф на разработку</title>
  <link rel="stylesheet" href="styles.css?v=6" />
  <link rel="stylesheet" href="decor.css?v=6" />
</head>
<body>
  <div class="page-glow glow-left" aria-hidden="true"></div>
  <div class="page-glow glow-right" aria-hidden="true"></div>
  <div class="page-glow glow-bottom" aria-hidden="true"></div>

  <main class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" id="brandLink" aria-label="Inky Fox — в начало">
        <span class="brand-mark">✦</span>
        <span class="brand-copy">
          <strong>INKY FOX</strong>
          <small>бриф на разработку</small>
        </span>
      </a>
      <div class="save-status" id="saveStatus" aria-live="polite"></div>
    </header>

    <section class="progress-shell is-hidden" id="progressShell">
      <div class="progress-meta">
        <span id="progressLabel">Шаг 1</span>
        <span id="progressPercent">0%</span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </section>

    <section class="quiz-card" id="quizCard">
      <div id="screen"></div>
    </section>

    <div class="nav-row is-hidden" id="navRow">
      <button class="btn btn-ghost" type="button" id="backBtn">Назад</button>
      <button class="btn btn-primary" type="button" id="nextBtn">Далее</button>
    </div>

    <div class="device-note is-hidden" id="deviceNote">Ответы сохраняются на этом устройстве — можно вернуться позже.</div>
  </main>

  <script src="quiz.js?v=6"></script>
</body>
</html>
